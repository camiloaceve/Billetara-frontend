<div class="login-container">
  <div class="row justify-content-center align-items-center min-vh-100 m-0">
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
      <div class="card shadow-lg border-0 animate__animated animate__fadeIn">
        <div class="card-body p-5">
          <!-- Logo y título -->
          <div class="text-center mb-4">
            <img src="assets/logo.svg" alt="Logo" class="logo mb-3" width="80">
            <h2 class="fw-bold text-primary">Billetera Digital</h2>
            <p class="text-muted">Inicia sesión para continuar</p>
          </div>

          <!-- Formulario -->
          <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <!-- Email -->
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">
                <i class="bi bi-envelope me-1"></i>Email
              </label>
              <input 
                type="email" 
                class="form-control form-control-lg" 
                id="email" 
                formControlName="email"
                [class.is-invalid]="email?.invalid && email?.touched"
                placeholder="usuario@ejemplo.com">
              
              <div class="invalid-feedback" *ngIf="email?.errors?.['required']">
                El email es requerido
              </div>
              <div class="invalid-feedback" *ngIf="email?.errors?.['email']">
                Ingresa un email válido
              </div>
            </div>
            
            <!-- Contraseña -->
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">
                <i class="bi bi-lock me-1"></i>Contraseña
              </label>
              <div class="input-group">
                <input 
                  [type]="showPassword ? 'text' : 'password'" 
                  class="form-control form-control-lg" 
                  id="password" 
                  formControlName="password"
                  [class.is-invalid]="password?.invalid && password?.touched"
                  placeholder="••••••••">
                <button 
                  class="btn btn-outline-secondary" 
                  type="button"
                  (click)="togglePasswordVisibility()">
                  <i [class]="showPassword ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
                </button>
              </div>
              
              <div class="invalid-feedback d-block" *ngIf="password?.errors?.['required'] && password?.touched">
                La contraseña es requerida
              </div>
              <div class="invalid-feedback d-block" *ngIf="password?.errors?.['minlength'] && password?.touched">
                Mínimo 6 caracteres
              </div>
            </div>
            
            <!-- Botón de envío -->
            <button 
              type="submit" 
              class="btn btn-primary btn-lg w-100 mb-3" 
              [disabled]="loginForm.invalid || loading">
              <span *ngIf="!loading">Iniciar Sesión</span>
              <span *ngIf="loading">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                Procesando...
              </span>
            </button>

            <!-- Enlaces adicionales -->
            <div class="text-center">
              <a routerLink="/auth/register" class="text-decoration-none">
                ¿No tienes cuenta? Regístrate
              </a>
            </div>

            <div class="text-center mt-2">
              <a routerLink="/auth/forgot-password" class="text-decoration-none small">
                ¿Olvidaste tu contraseña?
              </a>
            </div>
          </form>
        </div>
      </div>

      <!-- Footer -->
      <div class="text-center mt-4 text-muted small">
        © 2024 Billetera Digital. Todos los derechos reservados.
      </div>
    </div>
  </div>
</div>
