<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <!-- Logo -->
      <a class="navbar-brand" routerLink="/">
        <i class="bi bi-wallet2 me-2"></i>
        Billetera Digital
      </a>

      <!-- Botón menú móvil -->
      <button class="navbar-toggler" type="button" (click)="toggleMenu()">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menú -->
      <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item" *ngIf="isAuthenticated()">
            <a class="nav-link" routerLink="/wallet/dashboard" routerLinkActive="active">
              <i class="bi bi-house me-1"></i>
              Inicio
            </a>
          </li>
          <li class="nav-item" *ngIf="isAuthenticated()">
            <a class="nav-link" routerLink="/wallet/transactions" routerLinkActive="active">
              <i class="bi bi-clock-history me-1"></i>
              Transacciones
            </a>
          </li>
        </ul>

        <!-- Menú usuario -->
        <ul class="navbar-nav">
          <li class="nav-item dropdown" *ngIf="isAuthenticated()">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <i class="bi bi-person-circle me-1"></i>
              {{ currentUser?.nombre }} {{ currentUser?.apellido }}
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <a class="dropdown-item" routerLink="/wallet/profile">
                  <i class="bi bi-person me-2"></i>
                  Mi Perfil
                </a>
              </li>
              <li>
                <a class="dropdown-item" routerLink="/wallet/settings">
                  <i class="bi bi-gear me-2"></i>
                  Configuración
                </a>
              </li>
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item text-danger" href="#" (click)="$event.preventDefault(); logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>
                  Cerrar sesión
                </a>
              </li>
            </ul>
          </li>

          <li class="nav-item" *ngIf="!isAuthenticated()">
            <a class="nav-link" routerLink="/auth/login">
              <i class="bi bi-box-arrow-in-right me-1"></i>
              Iniciar sesión
            </a>
          </li>
          <li class="nav-item" *ngIf="!isAuthenticated()">
            <a class="nav-link" routerLink="/auth/register">
              <i class="bi bi-person-plus me-1"></i>
              Registrarse
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
</header>
